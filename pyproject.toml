[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guanchao"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.8", "httpx>=0.27", "python-multipart>=0.0.9"]

[tool.setuptools.dynamic]
version = {attr = "guanchao.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
