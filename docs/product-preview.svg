<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<rect width="1440" height="900" fill="#f2f0ea"/><rect x="236" y="62" width="844" height="838" fill="#faf9f5"/><rect x="1080" y="62" width="360" height="838" fill="#eceae4"/><rect y="62" width="236" height="838" fill="#eae8e1"/>
<g stroke="#d8d6cf"><path d="M0 62H1440M236 0V900M1080 62V900"/><path d="M236 178H1080M1080 111H1440"/></g>
<g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" fill="#191d1c">
<text x="55" y="39" font-size="20" font-weight="700">观潮</text><text x="105" y="39" font-size="10" fill="#707772">内容调查工作台</text>
<circle cx="258" cy="31" r="4" fill="#3f6e57"/><text x="270" y="36" font-size="11" fill="#707772">工作空间可用 · 待复核 0 · 文本 · 图片 · 视频 · 音频 · 文档</text>
<rect x="1305" y="14" width="113" height="36" rx="18" fill="#191d1c"/><text x="1332" y="37" font-size="11" fill="#fff">新建调查</text>
<text x="18" y="91" font-size="11" font-weight="700">待复核</text><text x="177" y="91" font-size="10" fill="#707772">查看全部</text>
<circle cx="31" cy="146" r="11" fill="none" stroke="#bdbbb3"/><text x="27" y="151" font-size="16">+</text><text x="51" y="150" font-size="12" font-weight="650">新建调查</text>
<text x="20" y="218" font-size="12" font-weight="650">没有待复核任务</text><text x="20" y="243" font-size="10" fill="#707772">新结论完成后会自动进入这里。</text>
<text x="264" y="102" font-size="9" fill="#707772">跨平台调查</text><text x="264" y="132" font-size="23" font-weight="700">查清一个账号，不只看一条内容。</text><text x="264" y="156" font-size="11" fill="#707772">给出目标和现有资料。系统会自己决定先看什么、哪里需要反向核对，以及什么时候证据足够。</text>
<text x="264" y="261" font-size="9" fill="#2e6760" font-weight="700">调查从目标开始</text><text x="264" y="318" font-size="48" font-weight="700">把账号、内容和素材放进来。</text><text x="264" y="369" font-size="48" fill="#2e6760" font-weight="700">剩下的核查顺序交给系统。</text><text x="264" y="416" font-size="13" fill="#707772">主页、近期内容、图片、视频、音频、文档可以放在同一个任务里持续补充。</text>
<path d="M264 463H1052M264 536H1052M264 609H1052M264 682H1052" stroke="#d8d6cf"/>
<text x="267" y="505" font-size="9" fill="#707772">01</text><text x="313" y="495" font-size="13" font-weight="650">判断一个账号是不是长期营销运营</text><text x="313" y="516" font-size="10" fill="#707772">从主页、近期内容和重复模式开始</text>
<text x="267" y="578" font-size="9" fill="#707772">02</text><text x="313" y="568" font-size="13" font-weight="650">我有图片或视频，结合内容一起核查</text><text x="313" y="589" font-size="10" fill="#707772">素材和文本进入同一条证据链</text>
<text x="267" y="651" font-size="9" fill="#707772">03</text><text x="313" y="641" font-size="13" font-weight="650">这个账号很商业，但我担心误判</text><text x="313" y="662" font-size="10" fill="#707772">优先检查稳定性和相反证据</text>
<rect x="264" y="764" width="788" height="106" rx="13" fill="#fffdf9" stroke="#bdbbb3"/><text x="282" y="800" font-size="12" fill="#707772">继续追问、要求反向核查，或补充新的判断目标…</text><text x="282" y="850" font-size="10" fill="#707772">＋ 添加素材</text><rect x="983" y="826" width="52" height="30" rx="15" fill="#191d1c"/><text x="999" y="846" font-size="10" fill="#fff">发送</text>
<text x="1098" y="92" font-size="10" font-weight="650">判断</text><text x="1143" y="92" font-size="10" fill="#707772">证据</text><text x="1187" y="92" font-size="10" fill="#707772">素材</text><text x="1230" y="92" font-size="10" fill="#707772">过程</text><path d="M1097 109H1121" stroke="#2e6760" stroke-width="2"/>
<circle cx="1260" cy="275" r="25" fill="none" stroke="#bdbbb3"/><circle cx="1260" cy="275" r="4" fill="#2e6760"/><text x="1224" y="331" font-size="13" font-weight="650">等待核查</text><text x="1158" y="360" font-size="10" fill="#707772">完成第一轮核查后，这里只保留结论、把握度</text><text x="1195" y="379" font-size="10" fill="#707772">和真正需要补的资料。</text>
</g></svg>
